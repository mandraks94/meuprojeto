<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .icon-container {
    width: 512px;
    height: 512px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<div class="icon-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#833AB4"/>
      <stop offset="25%" stop-color="#C13584"/>
      <stop offset="50%" stop-color="#E1306C"/>
      <stop offset="75%" stop-color="#FD1D1D"/>
      <stop offset="100%" stop-color="#F77737"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Fundo Gradiente Vibrante do Instagram com cantos arredondados (squircle) -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#igGrad)"/>

  <!-- Símbolo: Olho + Raio em Alto Contraste (Branco Espesso) -->
  <g filter="url(#dropShadow)">
    <!-- Contorno do Olho Super Visível -->
    <path d="M 80 256 C 135 145 377 145 432 256 C 377 367 135 367 80 256 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Centro: Círculo Branco com o Raio -->
    <circle cx="256" cy="256" r="76" fill="#FFFFFF"/>

    <!-- Raio Elétrico Recortado no Centro (Dourado/Gradiente) -->
    <path d="M 268 185 L 222 265 L 260 265 L 244 330 L 298 245 L 260 245 Z" 
          fill="url(#igGrad)"/>
  </g>
</svg>
</div>
</body>
</html>
