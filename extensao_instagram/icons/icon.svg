<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#833AB4"/>
      <stop offset="25%" stop-color="#C13584"/>
      <stop offset="50%" stop-color="#E1306C"/>
      <stop offset="75%" stop-color="#FD1D1D"/>
      <stop offset="100%" stop-color="#F77737"/>
    </linearGradient>
  </defs>

  <!-- Fundo Gradiente Vibrante do Instagram com Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#igGrad)"/>

  <!-- Contorno do Olho em Branco Bold -->
  <path d="M 80 256 C 135 145 377 145 432 256 C 377 367 135 367 80 256 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Pupila Branca Central -->
  <circle cx="256" cy="256" r="76" fill="#FFFFFF"/>

  <!-- Raio Elétrico Recortado no Centro com o Gradiente de Fundo -->
  <path d="M 268 185 L 222 265 L 260 265 L 244 330 L 298 245 L 260 245 Z" 
        fill="url(#igGrad)"/>
</svg>
